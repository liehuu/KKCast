name: Build KKCast dylib

on:
  push:
    branches: [main]
  workflow_dispatch:

# 这个工作流只做一件事：把 KKCast.dylib 编译出来并验证。
#
# 为什么不在这里打包 ipa：
#   打包需要的原始 ipa 有 12MB，base64 后 15.6MB，
#   远超 GitHub Secret 的 48KB 上限，进不了仓库也不该进
#   （那是他人作品，仓库是公开的）。
#   而注入 + 打包是纯 Python 逻辑，不需要 macOS 环境，
#   所以那一步放在本机跑（scripts/build_ipa.py），
#   CI 只交付一个经过校验的 dylib。

jobs:
  build:
    # 不能用 macos-14：本账号上这个 label 会被调度层直接拒绝，
    # 表现为 job 在 1 秒内 cancelled、steps=0、runner_name 为空，
    # 唯一的线索藏在 check-run 的 annotation 里：
    #   The configuration 'macos-14-arm64-us-default' is not supported
    # 这不是编译失败，也不是 YAML 错误 —— /jobs 有 1 个 job，但一步都没跑。
    # 实测（.github/workflows/probe.yml 的 matrix 结果）：
    #   ubuntu-latest ✅  macos-latest ✅  macos-15 ✅
    #   macos-14 ❌ 被拒（镜像不存在）  macos-14-large ❌ 被拒（需付费大机型）
    # 所以固定用 macos-15，不用 macos-latest（避免 latest 漂移改变 Xcode 版本）。
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # ── 门禁 1：源码静态契约 ────────────────────────────────
      # 放在编译之前。这一步只要 2 秒，能在浪费 6 分钟编译之前
      # 抓到"括号没配平 / 声明了没实现"这类纯搬运错误。
      - name: Gate 1 - ObjC 源码结构校验
        run: |
          set -euo pipefail
          python3 scripts/verify_objc.py
          echo ""
          echo "--- 反向注入：证明上面的检查会失败 ---"
          python3 scripts/selftest_objc.py

      # ── 门禁 2：注入工具自检 ────────────────────────────────
      # 注入逻辑是最容易静默出错的地方（改错一个偏移，产物依然
      # "看起来正常"，装上去才崩），所以拿构造样本 + 真实布局
      # 先把边界全测一遍。
      - name: Gate 2 - 注入工具自检
        run: |
          set -euo pipefail
          python3 scripts/selftest_inject.py
          echo ""
          echo "--- 证明 verify_dylib 会失败 ---"
          python3 scripts/selftest_verify_dylib.py

      - name: 选择 Xcode
        run: |
          set -euo pipefail
          # 不能硬写 /Applications/Xcode.app：镜像里通常叫 Xcode_16.app /
          # Xcode_15.4.app，写死会 "xcode-select: error: invalid developer directory"。
          # 先看默认的，够用就不动；不够用再挑一个版本号最高的。
          echo "--- 当前默认 ---"
          xcode-select -p || true
          xcodebuild -version || true
          if ! xcodebuild -version >/dev/null 2>&1; then
            CAND=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
            if [ -z "$CAND" ]; then
              echo "::error::镜像里没有任何 Xcode*.app"
              ls /Applications | head -30
              exit 1
            fi
            echo "切换到 $CAND"
            sudo xcode-select -s "$CAND"
          fi
          echo "--- 最终版本 ---"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      # ── 编译 ────────────────────────────────────────────────
      - name: 编译 KKCast.dylib
        run: |
          set -euo pipefail
          # 不能用 `xcodebuild ... | tee build.log | tail -40`：
          # 管道会吞掉 xcodebuild 的退出码，编译失败了 CI 依然是绿的，
          # 直到装到手机上才发现。所以先落文件，再单独判退出码。
          set +e
          xcodebuild \
            -project KKCast.xcodeproj \
            -scheme KKCast \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_BITCODE=NO \
            build > build.log 2>&1
          RC=$?
          set -e
          echo "--- 编译输出尾部 ---"
          tail -50 build.log
          if [ $RC -ne 0 ]; then
            echo "::error::xcodebuild 失败，退出码 $RC"
            echo "--- 所有 error: 行 ---"
            grep -n "error:" build.log | head -40 || true
            echo "--- 所有 warning: 行 ---"
            grep -n "warning:" build.log | head -40 || true
            exit $RC
          fi

      - name: 定位产物
        run: |
          set -euo pipefail
          # 这里踩过一个坑，记下来：
          # `find build -name 'KKCast.dylib' | head -1` 会匹配到**两个**文件，
          #   1) .../Release-iphoneos/KKCast.dylib                  ← 真正的 dylib
          #   2) .../KKCast.dylib.dSYM/Contents/Resources/DWARF/KKCast.dylib
          #                                                          ← 调试符号
          # dSYM 内部那个文件**也叫 KKCast.dylib**，但它的 filetype 是
          # MH_DSYM(10)，不是 MH_DYLIB(6)。按名字排序取第一个拿到的是符号
          # 文件，表现为 Gate 3 报 "filetype=10"、"没有 LC_ID_DYLIB"、
          # "__mod_init_func 为空" —— 三条一起报，看起来像编译出了问题，
          # 实际是取错了文件。
          #
          # 所以：不靠排序碰运气。先走确切的产物路径，再按 filetype 兜底。
          PROD="build/Build/Products/Release-iphoneos/KKCast.dylib"
          DYLIB=""
          if [ -f "$PROD" ]; then
            DYLIB="$PROD"
            echo "命中确切产物路径: $DYLIB"
          else
            echo "确切路径不存在，回退 find（排除 dSYM）"
            DYLIB=$(find build -name 'KKCast.dylib' -type f \
                    -not -path '*.dSYM/*' | head -1)
          fi
          if [ -z "$DYLIB" ]; then
            echo "::error::没找到 KKCast.dylib"
            find build -type f -name '*.dylib' | head -20
            exit 1
          fi
          mkdir -p dist-dylib
          cp "$DYLIB" dist-dylib/KKCast.dylib
          echo "DYLIB=dist-dylib/KKCast.dylib" >> "$GITHUB_ENV"
          echo "源产物: $DYLIB"
          ls -la dist-dylib/KKCast.dylib
          file dist-dylib/KKCast.dylib

      # ── 门禁 3：dylib 产物校验 ──────────────────────────────
      # 编译"成功"不等于产物可用。必须验：arm64、iOS 平台、
      # MH_DYLIB、__mod_init_func 非空、关键类没被裁掉。
      # 这些只能从字节读，不能信构建声明。
      - name: Gate 3 - dylib 产物校验
        run: |
          set -euo pipefail
          # $DYLIB 已在「定位产物」步骤里统一成 dist-dylib/KKCast.dylib，
          # 所以这里直接校验它，不需要再拷一次。
          python3 scripts/verify_dylib.py "$DYLIB"

          # 证明上面这个校验器**真的会失败**。
          # 不加这一步的话，verify_dylib 里任何一处写成永真判断
          # （例如曾经那个 `if "__DATA" in segs:` 把整段检查包起来），
          # CI 都会持续绿着，直到 dylib 装到手机上没反应才发现。
          echo ""
          echo "--- 反向注入：证明 Gate 3 会失败 ---"
          python3 scripts/selftest_verify_dylib.py

          echo "--- 编译警告统计 ---"
          grep -c "warning:" build.log || echo "0 warnings"

      - name: 汇总
        if: always()
        run: |
          {
            echo "## KKCast dylib"
            echo ""
            ls -la dist-dylib/ 2>/dev/null || true
            if [ -f dist-dylib/KKCast.dylib ]; then
              echo ""
              echo "sha256: \`$(shasum -a 256 dist-dylib/KKCast.dylib | cut -d' ' -f1)\`"
              echo "size: \`$(stat -f%z dist-dylib/KKCast.dylib)\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kkcast-dylib
          path: |
            dist-dylib/KKCast.dylib
            build.log
          retention-days: 14
          if-no-files-found: warn